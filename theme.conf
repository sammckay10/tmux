# Set default terminal and colors
set -g default-terminal "screen-256color"

# Status bar styling
set -g status-position top
set -g status on
set -g status-bg default
set -g status-fg white
set -g status-style bg=default,fg=white

# No clock or extra content
set -g status-left ''
set -g status-right ''

# Window list styling
setw -g window-status-format ' (#I) #W '
setw -g window-status-current-format ' (#I) #W '
setw -g window-status-style bg=default,fg=white
setw -g window-status-current-style bg=default,fg=brightyellow
set -g status-justify centre

# Pane border styling
set -g pane-border-style fg=white
set -g pane-active-border-style fg=brightyellow
set -g pane-border-lines heavy

# Message styling
set -g message-style bg=default,fg=white
set -g message-command-style bg=default,fg=white
